<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIP IKSPI Kera Sakti Cabang Kotawaringin Barat</title>
<style>
:root{--bg:#f5f2ee;--fg:#1d1a18;--card:#fff;--mut:#6f6862;--ac:#9f1d1d;--acf:#fff;--bd:#e3ded8;--ok:#1b6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#161312;--fg:#f3efeb;--card:#211d1b;--mut:#a39b94;--ac:#e0524f;--acf:#1a0d0d;--bd:#38322f;--ok:#58c27f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3,button,input,select,th,nav{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);color:var(--acf);padding:18px 16px}
header h1{margin:0;font-size:clamp(17px,3.6vw,26px);line-height:1.2;max-width:860px}
header small{display:block;margin-top:4px;opacity:.85;font-family:system-ui,sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;color:var(--mut);font-size:15px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--acf)}
nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:8px 0 12px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.stats b{display:block;font:700 24px system-ui,sans-serif}
.stats span{color:var(--mut);font:14px system-ui,sans-serif}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
th{font-size:13px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
.in{color:var(--ok)}.out{color:var(--ac)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
label{display:grid;gap:3px;font:13px system-ui,sans-serif;color:var(--mut)}
input,select{padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-size:15px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--acf);border:0;border-radius:6px;padding:10px 16px;font-size:15px;cursor:pointer}
.x{background:none;border:0;color:var(--ac);cursor:pointer;font-size:14px}
.note{color:var(--mut);font:14px system-ui,sans-serif;margin:0 0 10px}
.err{color:var(--ac);font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <h1>SISTEM INFORMASI PERGURUAN IKSPI KERA SAKTI CABANG KOTAWARINGIN BARAT</h1>
  <small id="who">Mode publik</small>
</header>
<nav id="nav"></nav>
<main id="c"></main>

<script>
// Tempel URL Web App Google Apps Script di bawah ini
const API_URL = "PASTE_URL_WEB_APP_DI_SINI";
const CABANG = "Cabang Kotawaringin Barat";
const TABS = [['beranda','Beranda'],['pengurus','Pengurus'],['anggota','Data Anggota'],['keuangan','Keuangan']];
let S = {user:null, d:{unit:[],pengurus:[],keuangan:[],anggota:[],hitung:{}}, tab:'beranda', msg:''};
let auth = null;
try { auth = JSON.parse(sessionStorage.getItem('a')); } catch (_) {}

const $ = s => document.querySelector(s);
const e = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = v => v ? new Date(v).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '';
const isA = () => S.user && S.user.role === 'admin';

async function api(b, a = auth) {
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({...b, auth:a})});
  return r.json();
}

async function load() {
  if (API_URL.startsWith('PASTE')) { $('#c').innerHTML = '<p class="err">API_URL belum diisi. Buka index.html dan tempel URL Web App Anda.</p>'; return; }
  try {
    const r = await api({action:'list'});
    if (r.error) throw new Error(r.error);
    S.user = r.user; S.d = r;
    if (!r.user && auth) { auth = null; sessionStorage.removeItem('a'); }
  } catch (x) { $('#c').innerHTML = '<p class="err">Gagal memuat data: ' + e(x.message) + '</p>'; return; }
  render();
}

function myUnits() {
  const U = S.d.unit;
  if (isA()) return [{tipe:'Cabang', nama:CABANG}, ...U];
  return U.filter(x => x.nama === S.user.unit || x.induk === S.user.unit);
}
function total(u) {
  const h = S.d.hitung;
  return (h[u.nama] || 0) + S.d.unit.filter(x => x.induk === u.nama).reduce((s, x) => s + (h[x.nama] || 0), 0);
}
const saldo = () => S.d.keuangan.reduce((s, k) => s + (k.jenis === 'Pemasukan' ? 1 : -1) * Number(k.jumlah || 0), 0);

function field(n, l, t = 'text', opts) {
  if (opts) return `<label>${l}<select name="${n}" required>${opts.map(o => `<option>${e(o)}</option>`).join('')}</select></label>`;
  return `<label>${l}<input name="${n}" type="${t}" required ${t === 'number' ? 'min="0"' : ''}></label>`;
}
function unitSel() { return field('unit', 'Unit', 'text', myUnits().map(u => u.nama)); }
function delBtn(s, id) { return isA() ? `<td><button class="x" onclick="del('${s}','${e(id)}')">Hapus</button></td>` : ''; }
const aTh = () => isA() ? '<th></th>' : '';

const V = {
  beranda() {
    const U = S.d.unit, n = Object.values(S.d.hitung).reduce((a, b) => a + b, 0);
    const ranting = U.filter(x => x.tipe === 'Ranting');
    const row = (u, ind) => `<tr><td style="padding-left:${10 + ind * 22}px">${e(u.nama)}</td><td>${e(u.tipe)}</td><td class="r">${total(u)}</td></tr>`;
    return `<div class="stats"><div><b>${n}</b><span>Total anggota</span></div><div><b>${ranting.length}</b><span>Ranting</span></div>
      <div><b>${U.length - ranting.length}</b><span>Sub ranting</span></div><div><b>${rp(saldo())}</b><span>Saldo kas</span></div></div>
      <div class="card tw"><h2>Jumlah anggota per unit</h2><table><tr><th>Unit</th><th>Tingkat</th><th class="r">Anggota</th></tr>
      ${row({nama:CABANG, tipe:'Cabang'}, 0).replace(/<td class="r">\d+/, `<td class="r">${n}`)}
      ${ranting.map(r => row(r, 1) + U.filter(s => s.induk === r.nama).map(s => row(s, 2)).join('')).join('') || '<tr><td colspan="3">Belum ada ranting. Admin dapat menambahkannya di menu Admin.</td></tr>'}</table></div>`;
  },
  pengurus() {
    const ord = {Cabang:0, Ranting:1, Subranting:2};
    const p = [...S.d.pengurus].sort((a, b) => ord[a.tingkat] - ord[b.tingkat] || String(a.unit).localeCompare(b.unit));
    const form = S.user ? `<div class="card"><h2>Tambah pengurus</h2><form onsubmit="add(event,'Pengurus')">${unitSel()}${field('jabatan','Jabatan')}${field('nama','Nama')}${field('periode','Periode (mis. 2024–2029)')}<button class="btn">Simpan</button></form></div>` : '';
    return form + `<div class="card tw"><h2>Susunan pengurus</h2><table><tr><th>Tingkat</th><th>Unit</th><th>Jabatan</th><th>Nama</th><th>Periode</th>${aTh()}</tr>
      ${p.map(r => `<tr><td>${e(r.tingkat)}</td><td>${e(r.unit)}</td><td>${e(r.jabatan)}</td><td>${e(r.nama)}</td><td>${e(r.periode)}</td>${delBtn('Pengurus', r.id)}</tr>`).join('') || '<tr><td colspan="5">Belum ada data pengurus.</td></tr>'}</table></div>`;
  },
  anggota() {
    if (!S.user) return '<div class="card"><p>Data anggota hanya dapat dilihat dan diisi setelah masuk. Gunakan menu Masuk.</p></div>';
    const a = S.d.anggota;
    return `<div class="card"><h2>Tambah anggota</h2><p class="note">Data yang sudah tersimpan hanya dapat diubah oleh admin.</p>
      <form onsubmit="add(event,'Anggota')">${unitSel()}${field('nama','Nama')}${field('angkatan','Angkatan')}${field('tingkat','Tingkat')}${field('niw','Nomor induk warga')}<button class="btn">Simpan</button></form></div>
      <div class="card tw"><h2>Daftar anggota (${a.length})</h2><table><tr><th>Nama</th><th>Angkatan</th><th>Tingkat</th><th>No. induk warga</th><th>Unit</th>${aTh()}</tr>
      ${a.map(r => `<tr><td>${e(r.nama)}</td><td>${e(r.angkatan)}</td><td>${e(r.tingkat)}</td><td>${e(r.niw)}</td><td>${e(r.unit)}</td>${delBtn('Anggota', r.id)}</tr>`).join('') || '<tr><td colspan="5">Belum ada anggota.</td></tr>'}</table></div>`;
  },
  keuangan() {
    const k = [...S.d.keuangan].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
    const sum = j => k.filter(x => x.jenis === j).reduce((s, x) => s + Number(x.jumlah || 0), 0);
    const form = isA() ? `<div class="card"><h2>Catat transaksi</h2><form onsubmit="add(event,'Keuangan')">${field('tanggal','Tanggal','date')}${field('jenis','Jenis','text',['Pemasukan','Pengeluaran'])}${field('keterangan','Keterangan')}${field('jumlah','Jumlah (Rp)','number')}<button class="btn">Simpan</button></form></div>` : '';
    return form + `<div class="stats"><div><b class="in">${rp(sum('Pemasukan'))}</b><span>Pemasukan</span></div><div><b class="out">${rp(sum('Pengeluaran'))}</b><span>Pengeluaran</span></div><div><b>${rp(saldo())}</b><span>Saldo</span></div></div>
      <div class="card tw"><h2>Laporan keuangan</h2><table><tr><th>Tanggal</th><th>Keterangan</th><th>Jenis</th><th class="r">Jumlah</th>${aTh()}</tr>
      ${k.map(r => `<tr><td>${tgl(r.tanggal)}</td><td>${e(r.keterangan)}</td><td>${e(r.jenis)}</td><td class="r ${r.jenis === 'Pemasukan' ? 'in' : 'out'}">${rp(r.jumlah)}</td>${delBtn('Keuangan', r.id)}</tr>`).join('') || '<tr><td colspan="4">Belum ada transaksi.</td></tr>'}</table></div>`;
  },
  admin() {
    if (!isA()) return '';
    const R = S.d.unit.filter(x => x.tipe === 'Ranting').map(x => x.nama);
    return `<div class="card"><h2>Tambah ranting / sub ranting</h2><form onsubmit="add(event,'Unit')">${field('tipe','Tipe','text',['Ranting','Subranting'])}${field('nama','Nama unit')}
      <label>Induk (untuk sub ranting)<select name="induk"><option value="">–</option>${R.map(o => `<option>${e(o)}</option>`).join('')}</select></label><button class="btn">Simpan</button></form>
      <div class="tw"><table><tr><th>Unit</th><th>Tipe</th><th>Induk</th><th></th></tr>${S.d.unit.map(u => `<tr><td>${e(u.nama)}</td><td>${e(u.tipe)}</td><td>${e(u.induk)}</td>${delBtn('Unit', u.id)}</tr>`).join('')}</table></div></div>
      <div class="card"><h2>Buat akun ranting / sub ranting</h2><form onsubmit="add(event,'Users')">${field('username','Username')}${field('password','Password','password')}${field('role','Peran','text',['ranting','subranting','admin'])}
      <label>Unit<select name="unit"><option value="">–</option>${S.d.unit.map(u => `<option>${e(u.nama)}</option>`).join('')}</select></label><button class="btn">Buat akun</button></form></div>`;
  },
  masuk() {
    return `<div class="card" style="max-width:380px"><h2>Masuk</h2><form onsubmit="login(event)" style="grid-template-columns:1fr">${field('u','Username')}${field('p','Password','password')}<button class="btn">Masuk</button></form><p class="err" id="le"></p></div>`;
  }
};

function render() {
  const tabs = [...TABS]; if (isA()) tabs.push(['admin','Admin']);
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('') + '<span class="sp"></span>'
    + (S.user ? '<button onclick="logout()">Keluar</button>' : `<button class="${S.tab === 'masuk' ? 'on' : ''}" onclick="go('masuk')">Masuk</button>`);
  $('#who').textContent = S.user ? `${S.user.username} · ${S.user.role}${S.user.unit ? ' ' + S.user.unit : ''}` : 'Mode publik';
  $('#c').innerHTML = (S.msg ? `<p class="err">${e(S.msg)}</p>` : '') + V[S.tab]();
  S.msg = '';
}
function go(t) { S.tab = t; render(); }

async function login(ev) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  const a = {u:f.u, p:f.p};
  const r = await api({action:'login'}, a);
  if (r.error) { $('#le').textContent = r.error; return; }
  auth = a; sessionStorage.setItem('a', JSON.stringify(a)); S.tab = 'beranda'; load();
}
function logout() { auth = null; sessionStorage.removeItem('a'); S.tab = 'beranda'; load(); }

async function add(ev, sheet) {
  ev.preventDefault();
  const data = Object.fromEntries(new FormData(ev.target));
  if (sheet === 'Anggota' || sheet === 'Pengurus') {
    const u = myUnits().find(x => x.nama === data.unit);
    data[sheet === 'Anggota' ? 'tipe' : 'tingkat'] = u ? u.tipe : '';
  }
  const btn = ev.target.querySelector('.btn'); btn.disabled = true;
  const r = await api({action:'add', sheet, data});
  if (r.error) { S.msg = r.error; btn.disabled = false; render(); return; }
  load();
}
async function del(sheet, id) {
  if (!confirm('Hapus data ini?')) return;
  const r = await api({action:'del', sheet, id});
  if (r.error) S.msg = r.error;
  load();
}
load();
</script>
</body>
</html>
