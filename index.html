<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISTEM INFORMASI PERGURUAN IKSPI KERA SAKTI CABANG KOTAWARINGIN BARAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#161a22;--mu:#5d6675;--ln:#dde1e8;--ac:#b3202a;--ac2:#8f1920;--ok:#17703f;--hd:#161a22;--hdt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--sf:#181c26;--tx:#eceff4;--mu:#98a1b1;--ln:#2a303d;--ac:#e24b55;--ac2:#c93843;--ok:#4cc58a;--hd:#0b0d12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--hd);color:var(--hdt);padding:18px 20px;border-bottom:4px solid var(--ac)}
header h1{margin:0;font:700 clamp(18px,3.6vw,28px)/1.15 "Barlow Condensed",sans-serif;letter-spacing:.02em;max-width:900px}
header small{color:#aab2c0}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
nav button{background:none;border:0;padding:8px 14px;font:600 15px inherit;color:var(--mu);cursor:pointer;border-radius:6px}
nav button.on{background:var(--ac);color:#fff}
nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 12px}
h3{margin:0 0 6px;font-size:17px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px}
.unit{border-left:4px solid var(--ac)}
.unit.r{margin-left:18px;border-left-color:var(--mu)}.unit.s{margin-left:36px;border-left-color:var(--ln)}
.badge{font-size:13px;color:var(--mu)}
.cnt{float:right;font:700 22px "Barlow Condensed";color:var(--ac)}
ul.p{list-style:none;padding:0;margin:8px 0 0}ul.p li{display:flex;gap:8px;padding:3px 0;border-top:1px solid var(--ln)}ul.p b{min-width:130px;font-weight:600;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:15px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}
td.n,th.n{text-align:right}
.in{color:var(--ok)}.out{color:var(--ac)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 16px}
.sum span{display:block;color:var(--mu);font-size:14px}.sum b{font:700 26px "Barlow Condensed"}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:14px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
button.pr{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 15px inherit;cursor:pointer}
button.pr:hover{background:var(--ac2)}
button.lk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit;padding:0 6px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:8px;display:none;max-width:90vw;z-index:9}
.note{color:var(--mu);font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1>SISTEM INFORMASI PERGURUAN IKSPI KERA SAKTI CABANG KOTAWARINGIN BARAT</h1><small>Struktur pengurus, data anggota, dan laporan keuangan</small></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>

<script>
// === GANTI dengan URL Web App Google Apps Script Anda ===
const API = "PASTE_URL_WEB_APP_DI_SINI";

const S = { user:null, pass:null, role:null, unit:null, units:[], pub:{unit:[],pengurus:[],keuangan:[]}, anggota:[], tab:"struktur" };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp " + Number(n||0).toLocaleString("id-ID");
const isAdmin = () => S.role === "admin";

function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",3500)}

async function api(action, data={}){
  const r = await fetch(API,{method:"POST",body:JSON.stringify({action,user:S.user,pass:S.pass,...data})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||"Terjadi kesalahan.");
  return j;
}
async function loadPub(){
  const r = await fetch(API); const j = await r.json();
  if(j.ok) S.pub = j;
}
async function loadAnggota(){ S.anggota = (await api("anggota")).anggota; }

async function run(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); await loadPub(); if(S.user) await loadAnggota(); render(); }
  catch(e){ toast(e.message); }
}

function renderNav(){
  const t=[["struktur","Struktur & Pengurus"],["keuangan","Laporan Keuangan"]];
  if(S.user) t.push(["anggota","Data Anggota"]);
  if(isAdmin()) t.push(["admin","Kelola"]);
  $("#nav").innerHTML = t.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-t="${k}">${l}</button>`).join("")
    + `<span class="sp"></span>` + (S.user ? `<button data-t="out">Keluar (${esc(S.user)})</button>` : `<button data-t="login">Masuk</button>`);
}
$("#nav").onclick = e => {
  const t = e.target.dataset.t; if(!t) return;
  if(t==="out"){ Object.assign(S,{user:null,pass:null,role:null,anggota:[],tab:"struktur"}); }
  else S.tab = t;
  render();
};

function vStruktur(){
  const u = S.pub.unit, pg = S.pub.pengurus;
  const tpl = (x,c) => `<div class="card unit ${c}"><span class="cnt" title="Jumlah anggota">${x.jumlah}</span><h3>${esc(x.tipe)} ${esc(x.nama.replace(/^(Cabang|Ranting|Subranting|Sub Ranting)\s+/i,""))}</h3>
    <div class="badge">${x.jumlah} anggota</div>
    <ul class="p">${pg.filter(p=>p.unit===x.nama).map(p=>`<li><b>${esc(p.jabatan)}</b><span>${esc(p.nama)}</span>${isAdmin()?`<button class="lk" data-del="Pengurus" data-id="${p.id}">hapus</button>`:""}</li>`).join("")||`<li class="note">Belum ada data pengurus.</li>`}</ul></div>`;
  const cab = u.filter(x=>x.tipe==="Cabang"), ran = u.filter(x=>x.tipe==="Ranting");
  let h = `<h2>Susunan Pengurus</h2>`;
  cab.forEach(c=>h+=tpl(c,""));
  ran.forEach(r=>{ h+=tpl(r,"r"); u.filter(s=>s.tipe==="Subranting"&&s.induk===r.nama).forEach(s=>h+=tpl(s,"s")); });
  u.filter(s=>s.tipe==="Subranting"&&!ran.some(r=>r.nama===s.induk)).forEach(s=>h+=tpl(s,"s"));
  if(S.user) h += `<div class="card"><h3>Tambah pengurus</h3><form id="fp"><label>Unit<select name="unit">${S.units.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
    <label>Jabatan<input name="jabatan" placeholder="Ketua, Sekretaris, ..." required></label><label>Nama<input name="nama" required></label><button class="pr">Simpan</button></form>
    ${isAdmin()?"":`<p class="note">Anda hanya dapat menambah data. Perubahan dan penghapusan dilakukan admin.</p>`}</div>`;
  return h;
}

function vKeuangan(){
  const k = [...S.pub.keuangan].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
  const m = k.filter(x=>x.jenis==="Pemasukan").reduce((s,x)=>s+x.jumlah,0), o = k.filter(x=>x.jenis==="Pengeluaran").reduce((s,x)=>s+x.jumlah,0);
  let h = `<h2>Laporan Keuangan Cabang</h2><div class="sum"><div><span>Total pemasukan</span><b class="in">${rp(m)}</b></div><div><span>Total pengeluaran</span><b class="out">${rp(o)}</b></div><div><span>Saldo kas</span><b>${rp(m-o)}</b></div></div>`;
  if(isAdmin()) h += `<div class="card"><h3>Catat transaksi</h3><form id="fk"><label>Tanggal<input type="date" name="tanggal" required></label><label>Uraian<input name="uraian" required></label>
    <label>Jenis<select name="jenis"><option>Pemasukan</option><option>Pengeluaran</option></select></label><label>Jumlah (Rp)<input type="number" min="0" name="jumlah" required></label><button class="pr">Simpan</button></form></div>`;
  h += `<div class="card tw"><table><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th class="n">Jumlah</th>${isAdmin()?"<th></th>":""}</tr>` +
    (k.map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.uraian)}</td><td class="${x.jenis==="Pemasukan"?"in":"out"}">${esc(x.jenis)}</td><td class="n">${rp(x.jumlah)}</td>${isAdmin()?`<td><button class="lk" data-del="Keuangan" data-id="${x.id}">hapus</button></td>`:""}</tr>`).join("")||`<tr><td colspan="5" class="note">Belum ada transaksi.</td></tr>`) + `</table></div>`;
  return h;
}

function vAnggota(){
  const per = {}; S.anggota.forEach(a=>per[a.unit]=(per[a.unit]||0)+1);
  return `<h2>Data Anggota</h2><div class="card"><h3>Tambah anggota</h3><form id="fa"><label>Unit<select name="unit">${S.units.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
    <label>Nama<input name="nama" required></label><label>Angkatan<input name="angkatan" required></label><label>Tingkat<input name="tingkat" required></label>
    <label>Nomor Induk Warga<input name="nia" required></label><button class="pr">Simpan</button></form>
    ${isAdmin()?"":`<p class="note">Anda dapat menambah anggota untuk unit Anda. Mengubah atau menghapus data hanya bisa dilakukan admin.</p>`}</div>
    <div class="card tw"><input id="q" placeholder="Cari nama atau nomor induk…" style="width:100%;margin-bottom:10px"><table id="ta"><tr><th>Nama</th><th>Angkatan</th><th>Tingkat</th><th>No. Induk Warga</th><th>Unit</th>${isAdmin()?"<th></th>":""}</tr>` +
    S.anggota.map(a=>`<tr><td>${esc(a.nama)}</td><td>${esc(a.angkatan)}</td><td>${esc(a.tingkat)}</td><td>${esc(a.nia)}</td><td>${esc(a.unit)}</td>${isAdmin()?`<td><button class="lk" data-edit="${a.id}">ubah</button><button class="lk" data-del="Anggota" data-id="${a.id}">hapus</button></td>`:""}</tr>`).join("") +
    `</table><p class="note">Total ${S.anggota.length} anggota.</p></div>`;
}

function vAdmin(){
  const u = S.pub.unit;
  return `<h2>Kelola Unit</h2><div class="card"><form id="fu"><label>Nama unit<input name="nama" required placeholder="Ranting Arut Selatan"></label>
    <label>Tingkat<select name="tipe"><option>Ranting</option><option>Subranting</option><option>Cabang</option></select></label>
    <label>Induk (untuk subranting)<select name="induk"><option value="">-</option>${u.filter(x=>x.tipe==="Ranting").map(x=>`<option>${esc(x.nama)}</option>`).join("")}</select></label><button class="pr">Tambah unit</button></form></div>
    <div class="card tw"><table><tr><th>Unit</th><th>Tingkat</th><th>Induk</th><th class="n">Anggota</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.tipe)}</td><td>${esc(x.induk)}</td><td class="n">${x.jumlah}</td><td><button class="lk" data-del="Unit" data-id="${x.id}">hapus</button></td></tr>`).join("")}</table></div>
    <p class="note">Akun ranting/subranting ditambahkan lewat fungsi buatUser() di Apps Script (lihat petunjuk).</p>`;
}

function vLogin(){
  return `<h2>Masuk</h2><div class="card" style="max-width:380px"><form id="fl" style="grid-template-columns:1fr"><label>Username<input name="user" autocomplete="username" required></label>
    <label>Kata sandi<input type="password" name="pass" autocomplete="current-password" required></label><button class="pr">Masuk</button></form>
    <p class="note">Masuk diperlukan untuk mengisi data. Struktur dan laporan keuangan dapat dilihat tanpa masuk.</p></div>`;
}

function render(){
  renderNav();
  const v = {struktur:vStruktur, keuangan:vKeuangan, anggota:vAnggota, admin:vAdmin, login:vLogin}[S.tab];
  $("#app").innerHTML = v();
}

$("#app").addEventListener("submit", e=>{
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), id = e.target.id;
  if(id==="fl"){ S.user=d.user; S.pass=d.pass;
    return api("login").then(async j=>{ Object.assign(S,{role:j.role,unit:j.unit,units:j.units,tab:"struktur"}); await loadAnggota(); toast("Berhasil masuk."); render(); })
      .catch(x=>{ S.user=S.pass=null; toast(x.message); }); }
  const act = {fp:"addPengurus",fa:"addAnggota",fk:"addKeuangan",fu:"addUnit"}[id];
  run(()=>api(act,d),"Data tersimpan.");
});
$("#app").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.del && confirm("Hapus data ini?")) run(()=>api("del"+b.dataset.del,{id:b.dataset.id}),"Data dihapus.");
  if(b.dataset.edit){
    const a = S.anggota.find(x=>x.id===b.dataset.edit);
    const nama=prompt("Nama",a.nama); if(nama===null) return;
    const angkatan=prompt("Angkatan",a.angkatan); if(angkatan===null) return;
    const tingkat=prompt("Tingkat",a.tingkat); if(tingkat===null) return;
    const nia=prompt("Nomor Induk Warga",a.nia); if(nia===null) return;
    run(()=>api("editAnggota",{id:a.id,unit:a.unit,nama,angkatan,tingkat,nia}),"Data diperbarui.");
  }
});
$("#app").addEventListener("input", e=>{
  if(e.target.id!=="q") return;
  const q=e.target.value.toLowerCase();
  document.querySelectorAll("#ta tr").forEach((r,i)=>{ if(i) r.classList.toggle("hide", !r.textContent.toLowerCase().includes(q)); });
});

render();
loadPub().then(render).catch(()=>toast("Gagal memuat data. Periksa URL Web App pada konfigurasi API."));
</script>
</body>
</html>
