<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISTEM INFORMASI PERGURUAN IKSPI KERA SAKTI CABANG KOTAWARINGIN BARAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--sf:#fff;--tx:#151922;--mu:#667085;--ln:#e6e8ee;--ac:#c8202d;--ac2:#a8161f;--ok:#138a55;--sb:#12151c;--sbt:#b9c0cd;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1016;--sf:#171b24;--tx:#edf0f5;--mu:#9aa3b2;--ln:#262c38;--ac:#ea4b57;--ac2:#d13843;--ok:#4cc58a;--sb:#090b10;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.55 Manrope,system-ui,sans-serif}
button,input,select{font-family:inherit}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
aside{background:var(--sb);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
#logo{width:46px;height:46px;object-fit:contain;border-radius:12px;background:#fff;padding:3px;flex:none}
.mk{display:none;width:46px;height:46px;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;place-items:center;flex:none}
#logo.hide+.mk{display:grid}
.brand b{display:block;font-weight:800;font-size:15px;line-height:1.2}.brand small{color:var(--sbt);font-size:12.5px}
nav{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow-y:auto}
nav button{text-align:left;background:none;border:0;color:var(--sbt);padding:11px 14px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:var(--ac);color:#fff}
nav .sp{flex:1}
.top{background:var(--sf);border-bottom:1px solid var(--ln);padding:16px 28px}
.top h1{margin:0;font-weight:800;font-size:clamp(14px,1.8vw,17px);letter-spacing:.01em}
main{padding:28px;max-width:1060px}
h2{font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0 0 14px}
h3{margin:0 0 8px;font-size:16.5px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.unit{border-left:4px solid var(--ac)}
.unit.r{margin-left:18px;border-left-color:#8a93a3}.unit.s{margin-left:36px;border-left-color:var(--ln)}
.badge{font-size:13px;color:var(--mu)}
.cnt{float:right;font-weight:800;font-size:26px;color:var(--ac)}
ul.p{list-style:none;padding:0;margin:10px 0 0}ul.p li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--ln)}ul.p b{min-width:130px;font-weight:600;color:var(--mu)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:hover td{background:rgba(127,127,127,.06)}
td.n,th.n{text-align:right}
.in{color:var(--ok)}.out{color:var(--ac)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.sum span{display:block;color:var(--mu);font-size:13.5px}.sum b{font-weight:800;font-size:26px;letter-spacing:-.01em}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 20px}.stat b{font-weight:800;font-size:30px;letter-spacing:-.02em}.stat span{color:var(--mu)}
details.sec{padding:0}details.sec>summary{padding:15px 18px;cursor:pointer;font-weight:700;list-style:none}
details.sec>summary::after{content:"+";float:right;color:var(--mu)}details.sec[open]>summary::after{content:"\2212"}
details.sec>*:not(summary){margin:0 18px 18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{font-size:13px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;gap:5px}
input,select{font-size:15px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(200,32,45,.18)}
button.pr{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
button.pr:hover{background:var(--ac2)}
button.lk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit;font-weight:600;padding:0 6px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sb);color:#fff;padding:11px 20px;border-radius:12px;display:none;max-width:90vw;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.note{color:var(--mu);font-size:13.5px}
.hide{display:none!important}
@media(max-width:860px){
.shell{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;z-index:5}
.brand{padding:0}.brand div{display:none}#logo,.mk{width:38px;height:38px}
nav{flex-direction:row;overflow-x:auto;overflow-y:hidden}nav button{white-space:nowrap;padding:9px 13px}nav .sp{display:none}
.top{padding:14px 16px}main{padding:18px 14px 60px}.unit.r{margin-left:10px}.unit.s{margin-left:20px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand"><img id="logo" class="hide" alt="Logo perguruan"><span class="mk">KS</span><div><b>IKSPI Kera Sakti</b><small>Cabang Kotawaringin Barat</small></div></div>
  <nav id="nav"></nav>
</aside>
<div>
  <div class="top"><h1>SISTEM INFORMASI PERGURUAN IKSPI KERA SAKTI CABANG KOTAWARINGIN BARAT</h1></div>
  <main id="app"></main>
</div>
</div>
<div id="msg" role="status"></div>

<script>
// === GANTI dengan URL Web App Google Apps Script Anda ===
const API_DEFAULT = "PASTE_URL_WEB_APP_DI_SINI";
let API = API_DEFAULT;
try { API = localStorage.getItem("api_url") || API_DEFAULT; } catch(e){}
const apiOk = () => /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API);

const S = { user:null, pass:null, role:null, unit:null, units:[], pub:{unit:[],pengurus:[],keuangan:[]}, anggota:[], users:[], tab:"struktur" };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp " + Number(n||0).toLocaleString("id-ID");
const isAdmin = () => S.role === "admin";
const canKeu = () => S.role === "admin" || S.role === "cabang";

function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",3500)}

async function api(action, data={}){
  const r = await fetch(API,{method:"POST",body:JSON.stringify({action,user:S.user,pass:S.pass,...data})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||"Terjadi kesalahan.");
  return j;
}
async function loadPub(){
  const r = await fetch(API); const j = await r.json();
  if(j.ok) S.pub = j;
}
async function loadAnggota(){ S.anggota = (await api("anggota")).anggota; }

async function run(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); await loadPub(); if(S.role==="admin") S.units=S.pub.unit.map(x=>x.nama); if(S.user) await loadAnggota(); if(isAdmin()) S.users=(await api("users")).users; render(); }
  catch(e){ toast(e.message); }
}

function renderNav(){
  const t=[["struktur","Struktur & Pengurus"],["keuangan","Laporan Keuangan"]];
  if(S.user){ t.unshift(["dashboard","Dashboard"]); t.push(["anggota","Data Anggota"]); }
  if(isAdmin()) t.push(["admin","Kelola"]);
  $("#nav").innerHTML = t.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-t="${k}">${l}</button>`).join("")
    + `<span class="sp"></span>` + (S.user ? `<button data-t="out">Keluar (${esc(S.user)})</button>` : `<button data-t="login">Masuk</button>`);
}
$("#nav").onclick = e => {
  const t = e.target.dataset.t; if(!t) return;
  if(t==="out"){ Object.assign(S,{user:null,pass:null,role:null,anggota:[],users:[],tab:"struktur"}); }
  else S.tab = t;
  render();
  if(S.tab==="admin") api("users").then(j=>{S.users=j.users;render();}).catch(x=>toast(x.message));
};

function vStruktur(){
  const u = S.pub.unit, pg = S.pub.pengurus;
  const tpl = (x,c) => `<div class="card unit ${c}"><span class="cnt" title="Jumlah anggota">${x.jumlah}</span><h3>${esc(x.tipe)} ${esc(x.nama.replace(/^(Cabang|Ranting|Subranting|Sub Ranting)\s+/i,""))}</h3>
    <div class="badge">${x.jumlah} anggota${x.jumlah!==x.langsung?` (${x.langsung} diinput langsung, ${x.jumlah-x.langsung} dari unit di bawahnya)`:""}</div>
    <ul class="p">${pg.filter(p=>p.unit===x.nama).map(p=>`<li><b>${esc(p.jabatan)}</b><span>${esc(p.nama)}</span></li>`).join("")||`<li class="note">Belum ada data pengurus.</li>`}</ul></div>`;
  const cab = u.filter(x=>x.tipe==="Cabang"), ran = u.filter(x=>x.tipe==="Ranting");
  let h = `<h2>Susunan Pengurus</h2>`;
  cab.forEach(c=>h+=tpl(c,""));
  ran.forEach(r=>{ h+=tpl(r,"r"); u.filter(s=>s.tipe==="Subranting"&&s.induk===r.nama).forEach(s=>h+=tpl(s,"s")); });
  u.filter(s=>s.tipe==="Subranting"&&!ran.some(r=>r.nama===s.induk)).forEach(s=>h+=tpl(s,"s"));
  return h;
}

function subOpts(r,sel){
  return S.pub.unit.filter(x=>x.tipe==="Subranting"&&x.induk===r&&S.units.includes(x.nama))
    .map(x=>`<option${x.nama===sel?" selected":""}>${esc(x.nama)}</option>`).join("");
}
function unitPicker(){
  const U=S.pub.unit, ok=n=>S.units.includes(n);
  const sub=U.filter(x=>x.tipe==="Subranting"&&ok(x.nama));
  const ran=U.filter(x=>x.tipe==="Ranting"&&(ok(x.nama)||sub.some(z=>z.induk===x.nama)));
  const fixed=S.role==="ranting"||S.role==="subranting";
  const r0=fixed&&ran[0]?ran[0].nama:"", s0=S.role==="subranting"&&sub[0]?sub[0].nama:"";
  return `<label>Cabang<select data-up="c">${U.filter(x=>x.tipe==="Cabang").map(x=>`<option>${esc(x.nama)}</option>`).join("")}</select></label>
    <label>Ranting<select data-up="r"><option value="">— Tingkat cabang —</option>${ran.map(x=>`<option${x.nama===r0?" selected":""}>${esc(x.nama)}</option>`).join("")}</select></label>
    <label>Sub ranting<select data-up="s"><option value="">— Tingkat ranting —</option>${subOpts(r0,s0)}</select></label><input type="hidden" name="unit">`;
}
function syncUP(f,fromR){
  const g=k=>f.querySelector(`[data-up="${k}"]`), h=f.querySelector('[name="unit"]');
  if(fromR) g("s").innerHTML=`<option value="">— Tingkat ranting —</option>`+subOpts(g("r").value,"");
  h.value=g("s").value||g("r").value||g("c").value;
}

function fKeu(bare){
  const f=`<form id="fk"><label>Tanggal<input type="date" name="tanggal" required></label><label>Uraian<input name="uraian" required></label>
    <label>Jenis<select name="jenis"><option>Pemasukan</option><option>Pengeluaran</option></select></label><label>Jumlah (Rp)<input type="number" min="0" name="jumlah" required></label><button class="pr">Simpan transaksi</button></form>`;
  return bare ? f : `<div class="card"><h3>Input laporan keuangan cabang</h3>${f}</div>`;
}

function vDash(){
  const mine=S.units, un=S.pub.unit.filter(x=>mine.includes(x.nama)), pg=S.pub.pengurus.filter(p=>mine.includes(p.unit));
  const lbl={admin:"Admin Cabang",cabang:"Pengurus Cabang",ranting:"Pengurus Ranting",subranting:"Pengurus Subranting"}[S.role]||S.role;
  const sec=(t,body,open)=>`<details class="card sec"${open?" open":""}><summary>${t}</summary>${body}</details>`;
  let h=`<h2>${esc(S.unit)}</h2><p class="note" style="margin:0">Masuk sebagai ${esc(lbl)}</p>
    <div class="stat"><span><b>${un.length}</b> unit</span><span><b>${S.anggota.length}</b> anggota</span><span><b>${pg.length}</b> pengurus</span></div>`;
  h+=sec("Tambah pengurus",`<form id="fp">${unitPicker()}<label>Jabatan<input name="jabatan" placeholder="Ketua, Sekretaris, ..." required></label><label>Nama<input name="nama" required></label><button class="pr">Simpan</button></form>
    ${isAdmin()?"":`<p class="note">Anda dapat menambah data. Perubahan dan penghapusan dilakukan admin.</p>`}`,true);
  h+=sec("Daftar pengurus",`<div class="tw"><table><tr><th>Unit</th><th>Jabatan</th><th>Nama</th>${isAdmin()?"<th></th>":""}</tr>`+
    (pg.map(p=>`<tr><td>${esc(p.unit)}</td><td>${esc(p.jabatan)}</td><td>${esc(p.nama)}</td>${isAdmin()?`<td><button class="lk" data-editp="${p.id}">ubah</button><button class="lk" data-del="Pengurus" data-id="${p.id}">hapus</button></td>`:""}</tr>`).join("")||`<tr><td colspan="4" class="note">Belum ada pengurus.</td></tr>`)+`</table></div>`,true);
  if(canKeu()) h+=sec("Input laporan keuangan",fKeu(true)+`<p class="note">Riwayat dan saldo ada di tab Laporan Keuangan.</p>`);
  if(isAdmin()) h+=sec("Logo",`<p class="note">Logo tampil di bagian atas semua halaman. Gambar diperkecil otomatis.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${S.pub.logo?`<img src="${S.pub.logo}" alt="" style="height:56px;background:#fff;border-radius:6px;padding:3px;border:1px solid var(--ln)">`:""}
    <input type="file" id="lg" accept="image/*" class="hide"><button type="button" class="pr" id="lgb">Unggah logo</button>${S.pub.logo?`<button type="button" class="lk" data-hlogo="1">hapus logo</button>`:""}</div>`);
  h+=sec("Ganti sandi",`<form id="fg"><label>Sandi baru (min. 6 karakter)<input type="password" name="baru" minlength="6" required autocomplete="new-password"></label>
    <label>Ulangi sandi baru<input type="password" name="ulang" required autocomplete="new-password"></label><button class="pr">Ganti sandi</button></form>`);
  return h;
}

function ubahLogo(file){
  if(!file) return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
    let data="";
    for(const sz of [160,128,96,64]){
      const k=Math.min(1,sz/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      for(const f of ["image/png","image/jpeg"]){ const d=c.toDataURL(f,0.85); if(d.length<=45000){ data=d; break; } }
      if(data) break;
    }
    URL.revokeObjectURL(url);
    if(!data){ toast("Gambar terlalu rumit. Gunakan logo yang lebih sederhana."); return; }
    run(()=>api("setLogo",{logo:data}),"Logo diperbarui.");
  };
  img.onerror=()=>toast("File bukan gambar yang valid.");
  img.src=url;
}

function vKeuangan(){
  const k = [...S.pub.keuangan].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
  const m = k.filter(x=>x.jenis==="Pemasukan").reduce((s,x)=>s+x.jumlah,0), o = k.filter(x=>x.jenis==="Pengeluaran").reduce((s,x)=>s+x.jumlah,0);
  let h = `<h2>Laporan Keuangan Cabang</h2><div class="sum"><div><span>Total pemasukan</span><b class="in">${rp(m)}</b></div><div><span>Total pengeluaran</span><b class="out">${rp(o)}</b></div><div><span>Saldo kas</span><b>${rp(m-o)}</b></div></div>`;
  if(canKeu()) h += fKeu();
  h += `<div class="card tw"><table><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th class="n">Jumlah</th>${canKeu()?"<th></th>":""}</tr>` +
    (k.map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.uraian)}</td><td class="${x.jenis==="Pemasukan"?"in":"out"}">${esc(x.jenis)}</td><td class="n">${rp(x.jumlah)}</td>${canKeu()?`<td><button class="lk" data-del="Keuangan" data-id="${x.id}">hapus</button></td>`:""}</tr>`).join("")||`<tr><td colspan="5" class="note">Belum ada transaksi.</td></tr>`) + `</table></div>`;
  return h;
}

function vAnggota(){
  const per = {}; S.anggota.forEach(a=>per[a.unit]=(per[a.unit]||0)+1);
  return `<h2>Data Anggota</h2><div class="card"><h3>Tambah anggota</h3><form id="fa">${unitPicker()}
    <label>Nama<input name="nama" required></label><label>Angkatan<input name="angkatan" required></label><label>Tingkat<input name="tingkat" required></label>
    <label>Nomor Induk Warga<input name="nia" required></label><button class="pr">Simpan</button></form>
    ${isAdmin()?"":`<p class="note">Anda dapat menambah anggota untuk unit Anda. Mengubah atau menghapus data hanya bisa dilakukan admin.</p>`}</div>
    <div class="card tw"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px"><input id="q" placeholder="Cari nama atau nomor induk…" style="flex:1;min-width:200px"><select id="uf"><option value="">Semua unit</option>${[...new Set(S.anggota.map(a=>a.unit))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><table id="ta"><tr><th>Nama</th><th>Angkatan</th><th>Tingkat</th><th>No. Induk Warga</th><th>Unit</th>${isAdmin()?"<th></th>":""}</tr>` +
    S.anggota.map(a=>`<tr><td>${esc(a.nama)}</td><td>${esc(a.angkatan)}</td><td>${esc(a.tingkat)}</td><td>${esc(a.nia)}</td><td>${esc(a.unit)}</td>${isAdmin()?`<td><button class="lk" data-edit="${a.id}">ubah</button><button class="lk" data-del="Anggota" data-id="${a.id}">hapus</button></td>`:""}</tr>`).join("") +
    `</table><p class="note">Total ${S.anggota.length} anggota.</p></div>`;
}

function unitOpts(role){
  const t={admin:"Cabang",cabang:"Cabang",ranting:"Ranting",subranting:"Subranting"}[role];
  return S.pub.unit.filter(x=>x.tipe===t).map(x=>`<option>${esc(x.nama)}</option>`).join("")||`<option value="">(belum ada unit ${t})</option>`;
}
function vAdmin(){
  const u = S.pub.unit;
  return `<h2>Kelola Unit</h2><div class="card"><form id="fu"><label>Nama unit<input name="nama" required placeholder="Ranting Arut Selatan"></label>
    <label>Tingkat<select name="tipe"><option>Ranting</option><option>Subranting</option><option>Cabang</option></select></label>
    <label>Induk (untuk subranting)<select name="induk"><option value="">-</option>${u.filter(x=>x.tipe==="Ranting").map(x=>`<option>${esc(x.nama)}</option>`).join("")}</select></label><button class="pr">Tambah unit</button></form></div>
    <div class="card tw"><table><tr><th>Unit</th><th>Tingkat</th><th>Induk</th><th class="n">Anggota (total)</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.tipe)}</td><td>${esc(x.induk)}</td><td class="n">${x.jumlah}</td><td><button class="lk" data-del="Unit" data-id="${x.id}">hapus</button></td></tr>`).join("")}</table></div>
    <h2 style="margin-top:28px">Kelola Akun</h2>
    <div class="card"><form id="fv"><label>Username<input name="username" required autocomplete="off" placeholder="ranting_arsel"></label>
    <label>Kata sandi (min. 6)<input type="text" name="password" minlength="6" required autocomplete="off"></label>
    <label>Peran<select name="role" data-role="1"><option value="ranting">Ranting</option><option value="subranting">Sub ranting</option><option value="cabang">Cabang (bendahara/pengurus)</option><option value="admin">Admin</option></select></label>
    <label>Unit<select name="unit" required>${unitOpts("ranting")}</select></label><button class="pr">Buat akun</button></form>
    <p class="note">Peran harus sesuai tingkat unit. Unit dibuat dulu di bagian atas halaman ini.</p></div>
    <div class="card tw"><table><tr><th>Username</th><th>Peran</th><th>Unit</th><th></th></tr>${S.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${esc(x.unit)}</td><td><button class="lk" data-reset="${esc(x.username)}">ganti sandi</button>${x.username===S.user?"":`<button class="lk" data-delu="${esc(x.username)}">hapus</button>`}</td></tr>`).join("")||`<tr><td colspan="4" class="note">Memuat…</td></tr>`}</table></div>`;
}

function vLogin(){
  return `<h2>Masuk</h2><div class="card" style="max-width:380px"><form id="fl" style="grid-template-columns:1fr"><label>Username<input name="user" autocomplete="username" required></label>
    <label>Kata sandi<input type="password" name="pass" autocomplete="current-password" required></label><button class="pr">Masuk</button></form>
    <p class="note">Masuk diperlukan untuk mengisi data. Struktur dan laporan keuangan dapat dilihat tanpa masuk.</p></div>`;
}

function vSetup(){
  return `<h2>Hubungkan ke Google Sheets</h2><div class="card" style="max-width:640px"><form id="fs" style="grid-template-columns:1fr"><label>URL Web App (berakhiran /exec)<input name="url" placeholder="https://script.google.com/macros/s/.../exec" required></label><button class="pr">Simpan dan hubungkan</button></form>
  <p class="note">Salin dari Apps Script: Deploy → Manage deployments → Web app URL. Pengaturan ini tersimpan di browser ini.</p></div>`;
}
function render(){
  renderNav();
  const v = {struktur:vStruktur, keuangan:vKeuangan, anggota:vAnggota, admin:vAdmin, login:vLogin, setup:vSetup, dashboard:vDash}[S.tab];
  $("#app").innerHTML = v();
  const L=$("#logo"); if(S.pub.logo){ L.src=S.pub.logo; L.classList.remove("hide"); } else L.classList.add("hide");
  document.querySelectorAll("#app form").forEach(f=>{ if(f.querySelector("[data-up]")) syncUP(f,false); });
}

$("#app").addEventListener("submit", e=>{
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), id = e.target.id;
  if(id==="fs"){ API=d.url.trim();
    if(!apiOk()){ toast("URL harus berbentuk https://script.google.com/macros/s/.../exec"); return; }
    try{ localStorage.setItem("api_url",API); }catch(x){}
    S.tab="struktur"; return loadPub().then(()=>{render();toast("Terhubung.");}).catch(()=>{S.tab="setup";render();toast("Gagal terhubung. Periksa URL dan pengaturan akses Web App (Anyone).");}); }
  if(id==="fg"){
    if(d.baru!==d.ulang){ toast("Sandi baru dan ulangannya tidak sama."); return; }
    return api("ubahSandi",{baru:d.baru}).then(()=>{ S.pass=d.baru; e.target.reset(); toast("Sandi berhasil diganti."); }).catch(x=>toast(x.message)); }
  if(id==="fl"){ S.user=d.user; S.pass=d.pass;
    return api("login").then(async j=>{ Object.assign(S,{role:j.role,unit:j.unit,units:j.units,tab:"dashboard"}); await loadAnggota(); toast("Berhasil masuk."); render(); })
      .catch(x=>{ S.user=S.pass=null; toast(x.message); }); }
  if((id==="fp"||id==="fa") && !S.units.includes(d.unit)){ toast("Pilih ranting atau sub ranting yang Anda kelola."); return; }
  if(id==="fu" && d.tipe==="Subranting" && !d.induk){ toast("Sub ranting harus memiliki ranting induk."); return; }
  const act = {fp:"addPengurus",fa:"addAnggota",fk:"addKeuangan",fu:"addUnit",fv:"addUser"}[id];
  run(()=>api(act,d),"Data tersimpan.");
});
$("#app").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.del && confirm("Hapus data ini?")) run(()=>api("del"+b.dataset.del,{id:b.dataset.id}),"Data dihapus.");
  if(b.id==="lgb"){ $("#lg").click(); return; }
  if(b.dataset.hlogo && confirm("Hapus logo?")) run(()=>api("hapusLogo"),"Logo dihapus.");
  if(b.dataset.reset){
    const pw=prompt("Sandi baru untuk "+b.dataset.reset+" (min. 6 karakter)"); if(!pw) return;
    run(()=>api("resetSandi",{username:b.dataset.reset,password:pw}),"Sandi diganti.");
  }
  if(b.dataset.delu && confirm("Hapus akun "+b.dataset.delu+"?")) run(()=>api("delUser",{username:b.dataset.delu}),"Akun dihapus.");
  if(b.dataset.editp){
    const p = S.pub.pengurus.find(x=>x.id===b.dataset.editp);
    const jabatan=prompt("Jabatan",p.jabatan); if(jabatan===null) return;
    const nama=prompt("Nama",p.nama); if(nama===null) return;
    run(()=>api("editPengurus",{id:p.id,jabatan,nama}),"Data diperbarui.");
  }
  if(b.dataset.edit){
    const a = S.anggota.find(x=>x.id===b.dataset.edit);
    const nama=prompt("Nama",a.nama); if(nama===null) return;
    const angkatan=prompt("Angkatan",a.angkatan); if(angkatan===null) return;
    const tingkat=prompt("Tingkat",a.tingkat); if(tingkat===null) return;
    const nia=prompt("Nomor Induk Warga",a.nia); if(nia===null) return;
    run(()=>api("editAnggota",{id:a.id,unit:a.unit,nama,angkatan,tingkat,nia}),"Data diperbarui.");
  }
});
$("#app").addEventListener("change", e=>{
  if(e.target.id==="lg"){ ubahLogo(e.target.files[0]); return; }
  if(e.target.id==="uf"){ filt(); return; }
  if(e.target.dataset.role){ e.target.closest("form").querySelector('[name="unit"]').innerHTML=unitOpts(e.target.value); return; }
  const k=e.target.dataset.up; if(!k) return;
  syncUP(e.target.closest("form"), k==="r");
});
function filt(){
  const q=($("#q").value||"").toLowerCase(), u=$("#uf").value;
  document.querySelectorAll("#ta tr").forEach((r,i)=>{ if(i) r.classList.toggle("hide", !(r.textContent.toLowerCase().includes(q) && (!u || r.children[4].textContent===u))); });
}
$("#app").addEventListener("input", e=>{ if(e.target.id==="q") filt(); });

if(!apiOk()){ S.tab="setup"; render(); }
else { render(); loadPub().then(render).catch(()=>{ S.tab="setup"; render(); toast("Gagal memuat data. Periksa URL Web App."); }); }
</script>
</body>
</html>
